<!doctype html>
<html lang="gu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>લૉગિન - જમોને જમાડું રે</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap narrow">
    <div class="login-hero">
      <div class="title">અન્નકૂટોત્સવ</div>
      <div class="sub">જમોને જમાડું રે...</div>
      <div style="color:var(--muted);font-size:14px">બી.એ.પી.એસ. શ્રી સ્વામિનારાયણ મંદિર, પોરબંદર</div>
    </div>
    <form class="card" id="loginForm">
      <h2>લૉગિન (Login)</h2>
      <label>મોબાઇલ નંબર</label>
      <input name="mobile" type="tel" inputmode="numeric" maxlength="10" autocomplete="username" required>
      <label>પાસવર્ડ</label>
      <input name="password" type="password" autocomplete="current-password" required>
      <label class="check"><input type="checkbox" name="remember" checked> મને યાદ રાખો (આ ફોનમાં લૉગિન રહેવા દો)</label>
      <button class="block" type="submit">લૉગિન કરો</button>
    </form>
    <form class="card hidden" id="changeForm">
      <h2>નવો પાસવર્ડ સેટ કરો</h2>
      <p style="color:var(--muted)">સુરક્ષા માટે, આગળ વધતા પહેલા તમારો પોતાનો પાસવર્ડ રાખો.</p>
      <div id="currentBox">
        <label>જૂનો પાસવર્ડ (Current password)</label>
        <input name="current" type="password" autocomplete="current-password">
      </div>
      <label>નવો પાસવર્ડ (ઓછામાં ઓછા 6 અક્ષર)</label>
      <input name="next" type="password" autocomplete="new-password" minlength="6" required>
      <label>નવો પાસવર્ડ ફરી લખો</label>
      <input name="again" type="password" autocomplete="new-password" minlength="6" required>
      <button class="block" type="submit">પાસવર્ડ સેટ કરો ✔</button>
    </form>
  </div>
  <script src="/common.js"></script>
  <script>
    const home = (u) => { location.href = u.role === 'admin' ? '/admin.html' : '/app.html'; };
    let user = null, typedPassword = '';

    function showChange() {
      $('#loginForm').classList.add('hidden');
      $('#changeForm').classList.remove('hidden');
      $('#currentBox').classList.toggle('hidden', !!typedPassword);
      $('#changeForm').next.focus();
    }

    // Already logged in? Go straight to the right page (or set a new password first)
    fetch('/api/me').then((r) => r.ok && r.json()).then((u) => {
      if (!u) return;
      user = u;
      if (u.must_change) showChange(); else home(u);
    });

    // Remember the mobile number on this phone
    const lf = $('#loginForm');
    try { lf.mobile.value = localStorage.getItem('mobile') || ''; } catch {}
    if (lf.mobile.value) lf.password.focus();

    lf.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      try {
        user = await api('/api/login', { method: 'POST', body: { mobile: lf.mobile.value, password: lf.password.value, remember: lf.remember.checked } });
        try { localStorage.setItem('mobile', lf.remember.checked ? lf.mobile.value : ''); } catch {}
        if (user.mustChange) { typedPassword = lf.password.value; showChange(); } else home(user);
      } catch (e) { toast(e.message, true); }
    });

    $('#changeForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = ev.target;
      if (f.next.value !== f.again.value) return toast(t('બંને પાસવર્ડ સરખા નથી'), true);
      try {
        await api('/api/me/password', { method: 'POST', body: { current: typedPassword || f.current.value, next: f.next.value } });
        toast(t('પાસવર્ડ બદલાઈ ગયો ✔'));
        setTimeout(() => home(user), 800);
      } catch (e) { toast(e.message, true); }
    });
  </script>
</body>
</html>
